<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Protect the House</title>
<meta name="description" content="A hockey game for 9 and 10 year olds: put your players in the right defensive spot.">
<meta property="og:title" content="Protect the House">
<meta property="og:description" content="Hockey positioning game: put your players in the right defensive spot!">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protect the House">
<meta name="theme-color" content="#0a1226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1226; --navy-2: #0d1730; --navy-3: #26324d;
    --ice: #eef5fb; --line-red: #d62839; --line-blue: #2457c5; --crease: #9fd0ff;
    --us: #1e6bff; --them: #2b2f36; --them-rim: #ff4d5e; --them-text: #ffb3ba;
    --gold: #ffb627; --text: #ffffff; --muted: #9fb7e6;
    --font-display: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
    --font-body: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
    --board-h: 52px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { touch-action: manipulation; }
  body {
    background: radial-gradient(120% 90% at 30% 0%, #1b2d55 0%, var(--navy) 55%, #050912 100%) fixed, var(--navy);
    color: var(--text); font-family: var(--font-body); font-weight: 600;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }
  .nojs { max-width: 32em; margin: 15vh auto 0; padding: 0 16px; text-align: center; font-size: 20px; line-height: 1.35; color: #fff; }
  .nojs h1 { font-family: var(--font-display); font-weight: 400; font-size: 56px; color: #ffb627; margin: 0 0 12px; }
  #app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  /* Scoreboard */
  .board {
    height: var(--board-h); flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: linear-gradient(var(--navy-2), #070c19); border-bottom: 2px solid var(--line-red);
    font-family: var(--font-display); letter-spacing: .08em; font-size: 20px;
  }
  .board .light { width: 14px; height: 14px; border-radius: 50%; background: #5a1a1f; flex: none; }
  .board .light.on { background: #ff2b2b; box-shadow: 0 0 12px 4px #ff2b2b; }
  .board .where { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board .score { color: var(--gold); text-shadow: 0 0 8px rgba(255, 182, 39, .7); white-space: nowrap; }
  .board .short { display: none; }
  @media (max-width: 520px) {
    .board .long { display: none; }
    .board .short { display: inline; }
  }
  .board .mute {
    background: none; border: 1px solid var(--navy-3); border-radius: 8px; width: 40px; height: 36px;
    display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .board .mute svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

  /* Play screen */
  #screen { flex: 1; display: flex; min-height: 0; }
  .play {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
    gap: 16px; padding: 12px 16px 16px; min-height: 0;
  }
  .stage {
    position: relative; min-height: 0;
    height: calc(100vh - var(--board-h) - 28px); height: calc(100dvh - var(--board-h) - 28px);
    display: flex; align-items: center; justify-content: center;
  }
  .placing #rink { cursor: crosshair; }
  #rink { display: block; overflow: hidden; filter: drop-shadow(0 0 14px rgba(120, 170, 255, .35)); }
  .panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding-top: 4px; }
  .panel .task { font-family: var(--font-display); font-size: 30px; line-height: 1.05; letter-spacing: .03em; }
  .panel .task small { display: block; font-size: 17px; color: var(--muted); letter-spacing: .08em; margin-bottom: 4px; }
  .bench { display: flex; flex-wrap: wrap; gap: 10px; min-height: 56px; align-items: center; }
  .bench:empty { display: none; }
  .bench-tok {
    width: 56px; height: 56px; border-radius: 50%; border: 3px solid #fff; background: var(--us);
    font-family: var(--font-display); font-size: 22px; letter-spacing: .04em;
    display: grid; place-items: center;
  }
  .bench-tok.waiting { opacity: .35; }
  .bench-tok.active { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255, 182, 39, .35), 0 0 18px rgba(255, 182, 39, .6); }
  .coach {
    background: rgba(255, 255, 255, .06); border-left: 5px solid var(--gold); border-radius: 4px;
    padding: 12px 14px; font-size: 19px; line-height: 1.25;
  }
  .coach .who { display: block; color: var(--gold); font-family: var(--font-display); letter-spacing: .1em; font-size: 17px; margin-bottom: 4px; }
  .primary {
    margin-top: auto; min-height: 60px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, #ff4d5e, var(--line-red)); color: #fff;
    font-family: var(--font-display); font-size: 30px; letter-spacing: .08em;
    box-shadow: 0 6px 0 #8f1622, 0 10px 24px rgba(214, 40, 57, .4);
  }
  .primary:disabled { background: var(--navy-3); color: #6f7fa3; box-shadow: none; cursor: default; }

  /* Rink tokens (drawn at radius 10 and scaled to the current disc radius) */
  .tok circle { stroke-width: 1.6; }
  .tok text { font-family: var(--font-display); font-size: 9.5px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .tok.us circle { fill: var(--us); stroke: #fff; }
  .tok.us text { fill: #fff; }
  .tok.them circle { fill: var(--them); stroke: var(--them-rim); }
  .tok.them text { fill: var(--them-text); }
  .tok.goalie circle { fill: var(--gold); stroke: #fff; }
  .tok.goalie text { fill: #111; }
  .tok.active circle { stroke: var(--gold); stroke-width: 2.4; }
  .tok circle.halo { fill: var(--gold); stroke: none; opacity: 0; transition: opacity .2s; }
  .tok.active circle.halo, .tok.lit circle.halo { opacity: .4; }
  .tok.lit circle:not(.halo) { stroke: var(--gold); stroke-width: 2.6; }
  .pick-phase .ours .tok { cursor: pointer; }
  .tok.old { opacity: .85; }
  .tok.old circle:not(.halo) { stroke-dasharray: 2.6 1.6; }
  .trails .trail { fill: none; stroke: var(--us); stroke-width: .5; stroke-dasharray: 1.6 1; stroke-linecap: round; }
  .trails .ghost { fill: none; stroke: var(--us); stroke-width: .35; stroke-dasharray: 1 .8; opacity: .7; }
  .trail-head { fill: var(--us); }
  .ours .tok.slide { transition: transform .6s cubic-bezier(.3, .7, .2, 1); }
  .tok .body.shake { animation: shake .5s ease-in-out 2; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3.5px); } 75% { transform: translateX(3.5px); } }
  .puck { fill: #111; stroke: #fff; stroke-width: 2.5; }
  .target-ring { fill: rgba(255, 182, 39, .18); stroke: var(--gold); stroke-width: .5; stroke-dasharray: 1.2 .8;
    transform-box: fill-box; transform-origin: center; animation: ring-pulse 1.2s ease-in-out infinite; }
  @keyframes ring-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: .7; } }

  /* Feedback banners sweep across the rink like a TV graphic */
  .banner-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .banner {
    position: absolute; left: -6%; right: -6%; top: 38%; padding: 10px 0; text-align: center; white-space: nowrap;
    font-family: var(--font-display); font-size: clamp(36px, 6.5vw, 78px); letter-spacing: .06em; color: #fff;
    text-shadow: 0 3px 0 rgba(0, 0, 0, .35); transform: translateX(-115%) skewY(-6deg);
    animation: sweep 1.8s cubic-bezier(.2, .9, .2, 1) forwards;
  }
  .banner.perfect { background: linear-gradient(90deg, var(--line-red), #ff4d5e 60%, var(--gold)); box-shadow: 0 0 44px rgba(255, 77, 94, .65); }
  .banner.nice { background: linear-gradient(90deg, #1546c4, var(--us) 60%, #6fa0ff); box-shadow: 0 0 36px rgba(30, 107, 255, .55); }
  .banner.close { background: linear-gradient(90deg, #b8620b, #f08c1a 60%, var(--gold)); }
  .banner.miss { background: repeating-linear-gradient(90deg, #111 0 34px, #f4f4f4 34px 68px); color: #fff;
    text-shadow: -3px -3px 0 #111, 3px -3px 0 #111, -3px 3px 0 #111, 3px 3px 0 #111; }
  .banner.pick { background: linear-gradient(90deg, #0f7a4a, #19b36b 60%, #7ef0b6); }
  .banner.hattrick { background: linear-gradient(90deg, var(--gold), #ffe08a 50%, var(--gold)); color: #111; text-shadow: none; box-shadow: 0 0 50px rgba(255, 182, 39, .8); }
  @keyframes sweep {
    0% { transform: translateX(-115%) skewY(-6deg); }
    16%, 72% { transform: translateX(0) skewY(-6deg); }
    100% { transform: translateX(115%) skewY(-6deg); }
  }
  @keyframes fade { 0% { opacity: 0; } 15%, 75% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .banner { transform: skewY(-6deg); animation: fade 1.8s ease forwards; }
    .tok .body.shake { animation: none; }
    .ours .tok.slide { transition-duration: .2s; }
    .target-ring { animation: none; }
  }

  /* Title, how-to, period, intermission and final screens */
  .scr {
    margin: auto; width: min(720px, 100%); padding: 32px 16px 40px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .scr .kicker { font-family: var(--font-display); letter-spacing: .22em; color: var(--muted); font-size: 22px; }
  .scr h1 {
    font-family: var(--font-display); font-weight: 400; margin: 0; line-height: .9; letter-spacing: .03em;
    font-size: clamp(64px, 13vw, 132px); text-shadow: 0 0 34px rgba(30, 107, 255, .55);
  }
  .scr h1 em { color: var(--gold); font-style: normal; text-shadow: 0 0 30px rgba(255, 182, 39, .55); }
  .scr h2 { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: clamp(36px, 6vw, 56px); letter-spacing: .04em; }
  .scr .sub { font-size: 22px; line-height: 1.25; color: #cfdcf7; max-width: 32ch; margin: 0; }
  .scr .best { font-family: var(--font-display); color: var(--gold); letter-spacing: .12em; font-size: 24px; }
  .cta {
    min-width: 280px; min-height: 70px; padding: 0 32px; border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(180deg, #ff4d5e, var(--line-red)); color: #fff;
    font-family: var(--font-display); font-size: 34px; letter-spacing: .1em;
    box-shadow: 0 6px 0 #8f1622, 0 12px 28px rgba(214, 40, 57, .45);
  }
  .cta:active { transform: translateY(3px); box-shadow: 0 3px 0 #8f1622; }
  .linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 20px; cursor: pointer; padding: 10px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; }
  .step { background: rgba(255, 255, 255, .06); border: 1px solid var(--navy-3); border-radius: 14px; padding: 20px 14px; font-size: 21px; line-height: 1.2; }
  .step b {
    display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 50%;
    background: var(--us); border: 3px solid #fff; font-family: var(--font-display); font-weight: 400; font-size: 26px;
  }
  .bigscore { font-family: var(--font-display); color: var(--gold); line-height: .9; font-size: clamp(76px, 15vw, 150px); text-shadow: 0 0 26px rgba(255, 182, 39, .6); }
  .bigscore small { font-size: .32em; color: var(--muted); letter-spacing: .06em; }
  .award { font-family: var(--font-display); font-size: clamp(48px, 9vw, 88px); letter-spacing: .05em; line-height: 1; }
  .newbest {
    background: var(--line-red); padding: 6px 18px; font-family: var(--font-display); letter-spacing: .12em; font-size: 28px;
    transform: rotate(-3deg); box-shadow: 0 0 26px rgba(214, 40, 57, .75);
  }
  .tally { display: flex; gap: 28px; font-family: var(--font-display); letter-spacing: .08em; font-size: 24px; color: var(--muted); }
  .tally b { display: block; color: #fff; font-weight: 400; font-size: 44px; }
  .gate-form { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(360px, 100%); }
  .gate-form label { font-family: var(--font-display); letter-spacing: .12em; font-size: 22px; color: var(--muted); }
  .gate-form input {
    width: 100%; font: inherit; font-size: 24px; text-align: center; padding: 12px 14px; border-radius: 10px;
    border: 2px solid var(--navy-3); background: rgba(255, 255, 255, .08); color: #fff;
    -webkit-user-select: text; user-select: text;
  }
  .gate-form input:focus { outline: none; border-color: var(--gold); }
  .gate-msg { min-height: 1.3em; margin: 0; color: #ff8f9b; font-size: 18px; }
  .gate-form.nope input { animation: shake-x .4s ease-in-out 2; }
  @keyframes shake-x { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .player-tag { font-family: var(--font-display); letter-spacing: .1em; font-size: 22px; color: #cfdcf7; }
  .title-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; }
  .lb { width: min(460px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .lb h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: .12em; font-size: 24px; margin: 0; color: var(--gold); }
  .lb-status { margin: 0; color: var(--muted); font-size: 18px; }
  .lb-tabs { display: flex; gap: 6px; }
  .lb-tab {
    flex: 1; padding: 8px 4px; border-radius: 10px; cursor: pointer;
    border: 2px solid rgba(255, 255, 255, .15); background: rgba(255, 255, 255, .04); color: var(--muted);
    font-family: var(--font-display); font-size: 18px; letter-spacing: .08em;
  }
  .lb-tab.on { border-color: var(--gold); color: var(--gold); background: rgba(255, 182, 39, .12); }
  .lb-body { display: flex; flex-direction: column; gap: 10px; }
  .who-choice { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
  .who-choice .cta { min-width: 220px; }
  .lb-rank { margin: 0; font-family: var(--font-display); font-size: 30px; letter-spacing: .04em; }
  .lb ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .lb li {
    display: grid; grid-template-columns: 2em 1fr auto; gap: 10px; align-items: center; text-align: left;
    padding: 8px 12px; border-radius: 8px; background: rgba(255, 255, 255, .05); font-size: 20px; font-variant-numeric: tabular-nums;
  }
  .lb li .r { font-family: var(--font-display); color: var(--muted); font-size: 22px; }
  .lb li .n { min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
  .lb li .s { font-family: var(--font-display); font-size: 24px; color: var(--gold); }
  .lb li.me { background: rgba(255, 182, 39, .18); outline: 2px solid var(--gold); }
  .lb li.gap { display: block; background: none; text-align: center; color: var(--muted); padding: 0; }
  .lb-overlay {
    position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: rgba(5, 9, 18, .94);
    display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 32px 16px;
  }
  .zlane { position: relative; width: 100%; height: 66px; border-radius: 33px; background: #c9d7e6; overflow: hidden; }
  .zlane::before {
    content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #f7fbff, #e6f3ff);
    transform-origin: left; animation: resurface 2.8s ease-in-out forwards;
  }
  .zamboni { position: absolute; top: 6px; left: -110px; width: 100px; height: 54px; animation: drive 2.8s ease-in-out forwards; }
  @keyframes resurface { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes drive { from { left: -110px; } to { left: 100%; } }
  @media (max-width: 640px) { .steps { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    .zlane::before { animation: none; }
    .zamboni { display: none; }
  }

  @media (orientation: portrait) {
    .play { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .stage { height: auto; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- Shown only where the game's code can't run, like a file preview in Messages. The game replaces it on load. -->
  <div class="nojs">
    <h1>Protect the House</h1>
    <p>This hockey game has to be opened from its web link in Safari or Chrome.</p>
    <p>A file preview (like tapping an attachment in a text message) can't run it. Ask your coach for the link.</p>
  </div>
</div>
<script id="htg-data">
// Game content: rink geometry, every play, and every coach line.
// Coordinates are in feet: x across the ice (0 = our LEFT boards, 85 = our RIGHT boards),
// y up the ice (0 = our end boards, 200 = their end boards).
(function () {
  const HTG = globalThis.HTG = globalThis.HTG || {};

  const RINK = {
    width: 85, length: 200, cornerRadius: 28,
    ourNet: { x: 42.5, y: 11 }, theirNet: { x: 42.5, y: 189 },
    netFront: { x: 42.5, y: 17 },   // top of our crease
    goalLineY: [11, 189], blueLineY: [75, 125], redLineY: 100,
    creaseRadius: 6, circleRadius: 15,
    endDots: [[20.5, 31], [64.5, 31], [20.5, 169], [64.5, 169]],
    nzDots: [[20.5, 80], [64.5, 80], [20.5, 120], [64.5, 120]],
    centerDot: [42.5, 100]
  };

  // Which slice of the rink each play shows, and which way is "deeper" in that zone.
  const VIEWS = {
    dzone: { yMin: 0, yMax: 82, deepSign: -1 },
    neutral: { yMin: 45, yMax: 145, deepSign: -1 },
    forecheck: { yMin: 105, yMax: 200, deepSign: 1 }
  };

  const ROLES = {
    puckD: {
      perfect: "That's pressure! Body between the puck and the net. They've got nowhere to go.",
      miss: "Somebody has to be ON the puck! The D on the puck's side goes right at the carrier, from the net side.",

    },
    netFrontD: {
      perfect: "Guarding the house! You're between their player and the net, and your stick cuts off the pass.",
      miss: 'Guard the front of the net: stay between their player and the net, a step toward the puck.',
      tooDeep: "Too deep! Step up so you're beside their player, between them and the puck.",
      wrongSide: "Protect the house! Their player is right in front of our net. Get between them and the net so they can't tip it in."
    },
    rushD: {
      perfect: 'Great gap! Inside position, stick on the puck. Push them to the boards.',
      miss: 'On a 1-on-1, stay a couple of stick lengths in front of the puck carrier, between them and the net.',
      tooDeep: "Too deep! Don't back into your goalie. Close the gap.",
      tooHigh: "Too far out! Step up too early and they'll skate right around you.",
      tooWide: "Stay inside! Don't let them cut to the middle.",
      wrongSide: 'Close the gap! Skate up to meet them, but stay on the net side: between them and our net.'

    partnerD: {
      perfect: 'Tracking back together! Level with your partner, guarding the middle.',
      miss: 'D partners skate back together. Get level with your partner, in the middle.',

      tooWide: 'Come to the middle! Protect the ice between the dots.'
    },
    lowC: {
      perfect: 'Center = third D! Low, between their helper and the net, ready to jump in.',
      miss: "When the puck's in our corner, the center stays LOW to help the D.",
      tooHigh: 'Too high! Centers come low to help when the puck is in our corner.',
      wrongSide: 'Center = third D! Get low, between their helper and our net, not behind them.'
    },
    strongW: {
      perfect: 'Perfect wing spot: between the point and the slot. You can jump the point or block a pass in.',
      miss: 'Wingers stay between the point and the slot.',
      tooDeep: "Too deep! Down low is the D's and center's job. Back up toward the point.",
      tooHigh: "Too high! Don't stand by the point like a cone. Come in a few strides."

    weakW: {

      tooDeep: "Too deep! It's crowded down there. Get up to the high slot, where you cover their D and the middle.",

    wallW: {
      perfect: "On the puck! Inside position, so they can't cut to the middle.",
      miss: 'Puck on your side boards = your puck. Go pressure it, from the inside.',

    },
    pointW: {
      perfect: 'In the shooting lane! Stick on the puck. Block that shot.',
      miss: 'Puck at the point: the wing on that side jumps out to pressure the shooter.',
      tooDeep: "Too deep! The shooter's wide open. Get out to the point!",
      wrongSide: 'Pressure the shooter! Get out on the point, in the shooting lane.'
    },
    slotC: {
      perfect: "Slot covered! You're between their player and the net.",
      miss: 'The center guards the slot. Get between their player and the net.',
      wrongSide: 'Protect the house! Their player is in the slot. Get between them and our net, not behind them.'
    },
    lowD: {
      perfect: 'Tied up! Between your player and the net. No tips, no rebounds.',
      miss: 'Get between your player and the front of the net. Anywhere on that line works.',
      wrongSide: 'Protect the house! Their player is right by our net. Get between them and the net, not behind them.'
    },
    belowLineD: {
      perfect: 'Stayed on the puck! Body between them and the front of the net.',
      miss: "Stay ON the puck carrier. Don't give them time!"
    },
