<style>
  :root {
    --navy: #0a1226; --navy-2: #0d1730; --navy-3: #26324d;
    --ice: #eef5fb; --line-red: #d62839; --line-blue: #2457c5; --crease: #9fd0ff;
    --us: #1e6bff; --them: #2b2f36; --them-rim: #ff4d5e; --them-text: #ffb3ba;
    --gold: #ffb627; --text: #ffffff; --muted: #9fb7e6;
    --font-display: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
    --font-body: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
    --board-h: 52px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { touch-action: manipulation; }
  body {
    background: radial-gradient(120% 90% at 30% 0%, #1b2d55 0%, var(--navy) 55%, #050912 100%) fixed, var(--navy);
    color: var(--text); font-family: var(--font-body); font-weight: 600;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }
  .nojs { max-width: 32em; margin: 15vh auto 0; padding: 0 16px; text-align: center; font-size: 20px; line-height: 1.35; color: #fff; }
  .nojs h1 { font-family: var(--font-display); font-weight: 400; font-size: 56px; color: #ffb627; margin: 0 0 12px; }
  #app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  /* Scoreboard */
  .board {
    height: var(--board-h); flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: linear-gradient(var(--navy-2), #070c19); border-bottom: 2px solid var(--line-red);
    font-family: var(--font-display); letter-spacing: .08em; font-size: 20px;
  }
  .board .light { width: 14px; height: 14px; border-radius: 50%; background: #5a1a1f; flex: none; }
  .board .light.on { background: #ff2b2b; box-shadow: 0 0 12px 4px #ff2b2b; }
  .board .where { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board .score { color: var(--gold); text-shadow: 0 0 8px rgba(255, 182, 39, .7); white-space: nowrap; }
  .board .short { display: none; }
  @media (max-width: 520px) {
    .board .long { display: none; }
    .board .short { display: inline; }
  }
  .board .mute {
    background: none; border: 1px solid var(--navy-3); border-radius: 8px; width: 40px; height: 36px;
    display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .board .mute svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

  /* Play screen */
  #screen { flex: 1; display: flex; min-height: 0; }
  .play {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
    gap: 16px; padding: 12px 16px 16px; min-height: 0;
  }
  .stage {
    position: relative; min-height: 0;
    height: calc(100vh - var(--board-h) - 28px); height: calc(100dvh - var(--board-h) - 28px);
    display: flex; align-items: center; justify-content: center;
  }
  .placing #rink { cursor: crosshair; }
  #rink { display: block; overflow: hidden; filter: drop-shadow(0 0 14px rgba(120, 170, 255, .35)); }
  .panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding-top: 4px; }
  .panel .task { font-family: var(--font-display); font-size: 30px; line-height: 1.05; letter-spacing: .03em; }
  .panel .task small { display: block; font-size: 17px; color: var(--muted); letter-spacing: .08em; margin-bottom: 4px; }
  .bench { display: flex; flex-wrap: wrap; gap: 10px; min-height: 56px; align-items: center; }
  .bench:empty { display: none; }
  .bench-tok {
    width: 56px; height: 56px; border-radius: 50%; border: 3px solid #fff; background: var(--us);
    font-family: var(--font-display); font-size: 22px; letter-spacing: .04em;
    display: grid; place-items: center;
  }
  .bench-tok.waiting { opacity: .35; }
  .bench-tok.active { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255, 182, 39, .35), 0 0 18px rgba(255, 182, 39, .6); }
  .coach {
    background: rgba(255, 255, 255, .06); border-left: 5px solid var(--gold); border-radius: 4px;
    padding: 12px 14px; font-size: 19px; line-height: 1.25;
  }
  .coach .who { display: block; color: var(--gold); font-family: var(--font-display); letter-spacing: .1em; font-size: 17px; margin-bottom: 4px; }
  .primary {
    margin-top: auto; min-height: 60px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(180deg, #ff4d5e, var(--line-red)); color: #fff;
    font-family: var(--font-display); font-size: 30px; letter-spacing: .08em;
    box-shadow: 0 6px 0 #8f1622, 0 10px 24px rgba(214, 40, 57, .4);
  }
  .primary:disabled { background: var(--navy-3); color: #6f7fa3; box-shadow: none; cursor: default; }

  /* Rink tokens (drawn at radius 10 and scaled to the current disc radius) */
  .tok circle { stroke-width: 1.6; }
  .tok text { font-family: var(--font-display); font-size: 9.5px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .tok.us circle { fill: var(--us); stroke: #fff; }
  .tok.us text { fill: #fff; }
  .tok.them circle { fill: var(--them); stroke: var(--them-rim); }
  .tok.them text { fill: var(--them-text); }
  .tok.goalie circle { fill: var(--gold); stroke: #fff; }
  .tok.goalie text { fill: #111; }
  .tok.active circle { stroke: var(--gold); stroke-width: 2.4; }
  .tok circle.halo { fill: var(--gold); stroke: none; opacity: 0; transition: opacity .2s; }
  .tok.active circle.halo, .tok.lit circle.halo { opacity: .4; }
  .tok.lit circle:not(.halo) { stroke: var(--gold); stroke-width: 2.6; }
  .pick-phase .ours .tok { cursor: pointer; }
  .tok.old { opacity: .85; }
  .tok.old circle:not(.halo) { stroke-dasharray: 2.6 1.6; }
  .trails .trail { fill: none; stroke: var(--us); stroke-width: .5; stroke-dasharray: 1.6 1; stroke-linecap: round; }
  .trails .ghost { fill: none; stroke: var(--us); stroke-width: .35; stroke-dasharray: 1 .8; opacity: .7; }
  .trail-head { fill: var(--us); }
  .ours .tok.slide { transition: transform .6s cubic-bezier(.3, .7, .2, 1); }
  .tok .body.shake { animation: shake .5s ease-in-out 2; }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3.5px); } 75% { transform: translateX(3.5px); } }

<script id="htg-logic">
// Pure scoring rules (spec §7). No DOM: tests load this block directly.
(function () {
  const HTG = globalThis.HTG = globalThis.HTG || {};
  const { RINK, ROLES, WRONG_SIDE_LINE, ON_COVER_LINE, TITLES, POINTS } = HTG.data;
  const TIER_ORDER = ['perfect', 'nice', 'close', 'miss'];
  const COVER_RADIUS = 8; // ft: this close to the D a wing covers counts as on them

  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function distToSegment(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    const k = len2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2)) : 0;
    return Math.hypot(p.x - (a.x + k * dx), p.y - (a.y + k * dy));
  }

  function tierFor(d, r) {
    if (d <= r) return 'perfect';
    if (d <= 2 * r) return 'nice';
    if (d <= 3 * r) return 'close';
    return 'miss';
  }

  // "Puck. You. Net.": you're on the wrong side if you're farther from our net than your check is.
  const isWrongSide = (placed, check, net) => dist(placed, net) > dist(check, net);

  // deepSign says which way is "deeper" in the zone: -1 in our end, +1 in theirs.
  function missDirection(placed, target, deepSign) {
    const dx = placed.x - target.x;
    const depth = (placed.y - target.y) * deepSign;
    if (Math.abs(depth) >= Math.abs(dx)) return depth > 0 ? 'tooDeep' : 'tooHigh';
    const centerX = RINK.width / 2;
    return Math.abs(placed.x - centerX) > Math.abs(target.x - centerX) ? 'tooWide' : null;
  }

  // A `lane` ({from, to}) scores by distance to that line instead of to the single target spot.
  // A `cover` is the D a wing covers: a spot right on them is never worse than close.
  function scorePlacement({ placed, target, check, net, deepSign, lane = null, cover = null }) {
    const distance = lane ? distToSegment(placed, lane.from, lane.to) : dist(placed, target);
    let tier = tierFor(distance, target.r);
    const wrongSide = check ? isWrongSide(placed, check, net) : false;
    if (wrongSide && TIER_ORDER.indexOf(tier) < TIER_ORDER.indexOf('close')) tier = 'close';
    const onCover = tier !== 'perfect' && cover ? dist(placed, cover) <= COVER_RADIUS : false;
    if (onCover && TIER_ORDER.indexOf(tier) > TIER_ORDER.indexOf('close')) tier = 'close';
    const direction = tier !== 'perfect' && !wrongSide && !onCover ? missDirection(placed, target, deepSign) : null;
    return { tier, points: POINTS[tier], distance, wrongSide, onCover, direction };
  }

  // `say` holds a play's own lines for this target, which win over the role's.
  function coachLine(result, roleKey, say = {}) {
    const role = ROLES[roleKey];
    if (result.tier === 'perfect') return say.perfect || role.perfect;
    if (result.wrongSide) return say.wrongSide || role.wrongSide || WRONG_SIDE_LINE;
    if (result.onCover) return say.onCover || ON_COVER_LINE;
    const directional = result.direction && (say[result.direction] || role[result.direction]);
    if (directional) return directional;
    return say.miss || role.miss;
  }

  function scoreSpotPick(tappedPos, wrongPos) {
    const correct = tappedPos === wrongPos;
    return { correct, points: correct ? POINTS.spotPick : 0 };
  }

  function scoreRotatePick(tappedPos, rightPos) {
    const correct = tappedPos === rightPos;
    return { correct, points: correct ? POINTS.rotatePick : 0 };
  }

  function maxScore(plays) {
    return plays.reduce((sum, play) => {
      if (play.type === 'spot') return sum + POINTS.spotPick + POINTS.perfect;
      // The last forward left in a rotation takes the last job, so there's one pick fewer than players.
      if (play.type === 'rotate') return sum + (play.order.length - 1) * POINTS.rotatePick + play.order.length * POINTS.perfect;
      return sum + play.order.length * POINTS.perfect * (play.double ? 2 : 1);
    }, 0);
  }

  function titleFor(score, max) {
    const share = score / max;
    return TITLES.find(t => share >= t.min).name;
  }

  function nextStreak(streak, tier) {
    if (tier !== 'perfect') return { streak: 0, hatTrick: false };
    return streak + 1 === 3 ? { streak: 0, hatTrick: true } : { streak: streak + 1, hatTrick: false };
  }

  // Keep a dropped player on the ice: inside the boards, rounded corners included.
  function clampToRink(p, margin = 2.5) {
    const { width, length, cornerRadius } = RINK;
    let x = Math.min(Math.max(p.x, margin), width - margin);
    let y = Math.min(Math.max(p.y, margin), length - margin);
    const cx = x < cornerRadius ? cornerRadius : x > width - cornerRadius ? width - cornerRadius : null;
    const cy = y < cornerRadius ? cornerRadius : y > length - cornerRadius ? length - cornerRadius : null;
    if (cx !== null && cy !== null) {
      const d = Math.hypot(x - cx, y - cy);
      const limit = cornerRadius - margin;
      if (d > limit) {
        x = cx + (x - cx) * limit / d;
        y = cy + (y - cy) * limit / d;
      }
    }
    return { x, y };
  }

  // Browser storage can be missing or throw (private mode, blocked site data):
  // reads fall back, writes are dropped, and the game keeps going either way.
  function makeStore(storage, prefix = 'htg.') {
    return {
      get(key, fallback) {
        try {
          const raw = storage.getItem(prefix + key);
          return raw === null || raw === undefined ? fallback : JSON.parse(raw);
        } catch (e) {
          return fallback;
        }
      },
      set(key, value) {
        try { storage.setItem(prefix + key, JSON.stringify(value)); } catch (e) { /* not saved */ }
      }
    };
  }

  // Team password gate. Only a hash of the password is in this file. It keeps casual visitors
  // out; it isn't real security, since anyone can read a public page's code.
  const TEAM_PASSWORD_HASH = '7ae1ebdb';

  function hashText(text) {
    let h = 0x811c9dc5;
    for (const ch of text) {
      h ^= ch.codePointAt(0);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(16).padStart(8, '0');
  }

  // Phones auto-capitalize and add stray spaces, so neither counts.
  function checkPassword(input) {
    return hashText(String(input).toLowerCase().replace(/\s+/g, '')) === TEAM_PASSWORD_HASH;
  }

  // Leaderboard names: first name only, letters (plus hyphen/apostrophe), capitalized, 16 characters at most.
  function cleanName(s) {
    return String(s || '').replace(/[^\p{L}\p{M}' -]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 16)
      .toLowerCase().replace(/(^|[ '-])(\p{L})/gu, (m, sep, ch) => sep + ch.toUpperCase());
  }

  const cleanNumber = s => String(s || '').replace(/\D/g, '').slice(0, 3);

  // 1-based place on the board (same name and number = same player), or null if not on it.
  // Rows and players with no `who` are players (scores from before parents could play).
  const whoOf = r => (r.who === 'parent' ? 'parent' : 'player');

  function findRank(board, player) {
    const i = board.findIndex(r => String(r.name).toLowerCase() === player.name.toLowerCase()
      && String(r.number) === player.number && whoOf(r) === whoOf(player));
    return i === -1 ? null : i + 1;
  }

  // Where a person's own best score is saved on the device, so a parent and their kid sharing a phone each keep theirs.
  const bestKey = p => `best.${whoOf(p)}.${p.name.toLowerCase()}#${p.number}`;

  // How someone shows on the board: "Max #12", or "Kevin (#12's parent)".
  function boardLabel(r) {
    if (whoOf(r) === 'parent') return `${r.name} (${r.number ? `#${r.number}'s parent` : 'parent'})`;
    return `${r.name}${r.number ? ' #' + r.number : ''}`;
  }

  HTG.logic = {
    dist, distToSegment, tierFor, isWrongSide, missDirection, scorePlacement, coachLine,
    scoreSpotPick, scoreRotatePick, maxScore, titleFor, nextStreak, clampToRink, makeStore,
    checkPassword, TEAM_PASSWORD_HASH, cleanName, cleanNumber, findRank, boardLabel, bestKey
  };
})();
</script>
<script id="htg-flow">
// The whole game as a pure reducer: (state, action) -> state. Actions that don't
// apply return the same state object, which makes double taps harmless.
(function () {
  const HTG = globalThis.HTG = globalThis.HTG || {};
  const { PLAYS, LAYOUTS, VIEWS, RINK, LANE_ROLES } = HTG.data;
  const L = HTG.logic;
  function createGame({ seenHowTo = false, best = 0 } = {}) {
    return {
      screen: 'title', seenHowTo, best, newBest: false,
      playIndex: 0, step: 0, phase: 'place', positions: {}, pending: null,
      score: 0, periodScores: [0, 0, 0], streak: 0, last: null
    };
  }

  function targetFor(play, pos) {
    const layout = LAYOUTS[play.layout];
    const t = layout.ours[pos];
    const at = id => { const o = id && layout.opponents.find(o => o.id === id); return o ? { x: o.x, y: o.y } : null; };
    return { x: t.x, y: t.y, r: t.r, role: t.role, say: t.say || {}, lane: t.lane || null, laneTo: t.laneTo || null, check: at(t.check), cover: at(t.cover) };
  }

  const activePos = state => Object.keys(state.positions).find(p => state.positions[p].status === 'active');

  // Players waiting on the bench carry no coordinates, so the answer never leaks to the screen.
  function setupPlay(state, playIndex) {
    const play = PLAYS[playIndex];
    const layout = LAYOUTS[play.layout];
    const positions = {};
    for (const pos of Object.keys(layout.ours)) {
      positions[pos] = { x: layout.ours[pos].x, y: layout.ours[pos].y, status: 'ice' };
    }
    let phase = 'place';
    if (play.type === 'spot') {
      positions[play.wrong.pos] = { x: play.wrong.x, y: play.wrong.y, status: 'wrong' };
      phase = 'pick';
    } else if (play.type === 'rotate') {
      // The forwards start where they finished the play before, each still wearing their old job.
      for (const pos of play.order) {
        const was = LAYOUTS[play.from].ours[pos];
        positions[pos] = { x: was.x, y: was.y, status: 'old', label: pos };
      }
      phase = 'pick';
    } else {
      const waiting = play.type === 'placeAll' ? play.order : [play.order[0]];
      for (const pos of waiting) positions[pos] = { x: null, y: null, status: 'bench' };
      positions[play.order[0]].status = 'active';
    }
    return { ...state, screen: 'play', playIndex, step: 0, phase, positions, pending: null, last: null };
  }

  function addPoints(state, points) {
    const periodScores = state.periodScores.slice();
    periodScores[PLAYS[state.playIndex].period - 1] += points;
    return { ...state, score: state.score + points, periodScores };
  }

  function pick(state, pos) {
    if (state.screen !== 'play' || state.phase !== 'pick' || !state.positions[pos]) return state;
    const play = PLAYS[state.playIndex];
    if (play.type === 'rotate') {
      if (state.positions[pos].status !== 'old') return state;
      const job = play.order[state.step];
      const right = play.was[job];
      const { correct, points } = L.scoreRotatePick(pos, right);
      const line = correct ? play.pickRight[job] : play.pickWrong[job];
      return addPoints({ ...state, phase: 'feedback', last: { kind: 'pick', tapped: pos, right, correct, points, line } }, points);
    }
    const { correct, points } = L.scoreSpotPick(pos, play.wrong.pos);
    const line = correct ? play.pickRight : play.pickWrong;
    return addPoints({ ...state, phase: 'feedback', last: { kind: 'pick', tapped: pos, right: play.wrong.pos, correct, points, line } }, points);
  }

  // A rotating forward takes their new job and skates from where they were (`from`).
  function takeJob(state, pos, job) {
    const { x, y } = state.positions[pos];
    const positions = { ...state.positions, [pos]: { x, y, status: 'active', label: job, from: { x, y } } };
    return { ...state, phase: 'place', positions, pending: null };
  }

  function lock(state) {
    if (state.screen !== 'play' || state.phase !== 'place' || !state.pending) return state;
    const play = PLAYS[state.playIndex];
    // In a spot-it play the player has to be moved off the wrong spot before it can be locked.
    if (play.type === 'spot' && state.pending.x === play.wrong.x && state.pending.y === play.wrong.y) return state;
    const pos = activePos(state);
    const target = targetFor(play, state.positions[pos].label || pos);
    const lane = target.lane
      || (target.check && LANE_ROLES.includes(target.role) ? { from: target.check, to: target.laneTo || RINK.netFront } : null);
    const result = L.scorePlacement({
      placed: state.pending, target, check: target.check, cover: target.cover, lane,
      net: RINK.ourNet, deepSign: VIEWS[LAYOUTS[play.layout].view].deepSign
    });
    const { streak, hatTrick } = L.nextStreak(state.streak, result.tier);
    const points = result.points * (play.double ? 2 : 1);
    const last = {
      kind: 'place', pos, from: state.pending, tier: result.tier, points,
      wrongSide: result.wrongSide, direction: result.direction, line: L.coachLine(result, target.role, target.say), hatTrick
    };
    // A perfect spot stays where the kid put it; anything else moves to the right spot so they can see it.
    const spot = result.tier === 'perfect' ? state.pending : { x: target.x, y: target.y };
    const positions = { ...state.positions, [pos]: { ...state.positions[pos], x: spot.x, y: spot.y, status: 'ice' } };
    return addPoints({ ...state, phase: 'feedback', positions, pending: null, streak, last }, points);
  }

  function next(state) {
    if (state.screen === 'intermission') return { ...state, screen: 'periodIntro' };
    if (state.screen !== 'play' || state.phase !== 'feedback') return state;
    const play = PLAYS[state.playIndex];
    if (state.last.kind === 'pick') {
      if (play.type === 'rotate') return takeJob(state, state.last.right, play.order[state.step]);
      const pos = play.wrong.pos;
      const positions = { ...state.positions, [pos]: { ...state.positions[pos], status: 'active' } };
      return { ...state, phase: 'place', positions, pending: { x: play.wrong.x, y: play.wrong.y } };
    }
    if (play.order && state.step + 1 < play.order.length) {
      const step = state.step + 1;
      const pos = play.order[step];
      if (play.type === 'rotate') {
        const left = Object.keys(state.positions).filter(p => state.positions[p].status === 'old');
        // The last forward left has only one job to take, so there's nothing to pick.
        return left.length > 1 ? { ...state, step, phase: 'pick', pending: null } : takeJob({ ...state, step }, left[0], pos);
      }
      const positions = { ...state.positions, [pos]: { ...state.positions[pos], status: 'active' } };
      return { ...state, step, phase: 'place', positions, pending: null };
    }
    const nextIndex = state.playIndex + 1;
    if (nextIndex >= PLAYS.length) {
      return { ...state, screen: 'final', best: Math.max(state.best, state.score), newBest: state.score > state.best };
    }
    if (PLAYS[nextIndex].period === play.period) return setupPlay(state, nextIndex);
    return { ...state, screen: 'intermission', playIndex: nextIndex };
  }

  function reduce(state, action) {
    switch (action.type) {
      case 'START':
        return state.screen === 'title' ? { ...state, screen: state.seenHowTo ? 'periodIntro' : 'howto' } : state;
      case 'HOWTO':
        return state.screen === 'title' ? { ...state, screen: 'howto' } : state;
      case 'LETS_GO':
        return state.screen === 'howto' ? { ...state, screen: 'periodIntro', seenHowTo: true } : state;
      case 'BEGIN_PERIOD':
        return state.screen === 'periodIntro' ? setupPlay(state, state.playIndex) : state;
      case 'JUMP':
        return Number.isInteger(action.playIndex) && action.playIndex >= 0 && action.playIndex < PLAYS.length
          ? setupPlay(state, action.playIndex) : state;
      case 'PICK':
        return pick(state, action.pos);
      case 'MOVE':
        if (state.screen !== 'play' || state.phase !== 'place') return state;
        if (!Number.isFinite(action.x) || !Number.isFinite(action.y)) return state;
        return { ...state, pending: L.clampToRink({ x: action.x, y: action.y }) };
      case 'LOCK':
        return lock(state);
      case 'NEXT':
        return next(state);
      case 'PLAY_AGAIN':
        return state.screen === 'final' ? createGame({ seenHowTo: state.seenHowTo, best: state.best }) : state;
      default:
        return state;
    }
  }

  HTG.flow = { createGame, reduce, targetFor };
})();
</script>
<script id="htg-audio">
// Arena sounds, synthesized with Web Audio (no audio files). Browsers (iPad especially)
// only allow sound after a tap, so nothing plays until unlock() runs inside one.
(function () {
  const HTG = globalThis.HTG = globalThis.HTG || {};
  const MASTER_GAIN = 0.6;
  const audio = { ctx: null, master: null, muted: false };
  let noise = null;
  let echo = null;

  function ensureContext() {
    if (audio.ctx) return audio.ctx;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    const ctx = new Ctx();
    audio.master = ctx.createGain();
    audio.master.gain.value = audio.muted ? 0 : MASTER_GAIN;
    audio.master.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const data = noise.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    // Arena echo: a convolver fed with a fading burst of stereo noise.
    const ir = ctx.createBuffer(2, ctx.sampleRate * 2.6, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3.2);
    }
    echo = ctx.createConvolver();
    echo.buffer = ir;
    const wet = ctx.createGain();
    wet.gain.value = 0.32;
    echo.connect(wet).connect(audio.master);
    audio.ctx = ctx;
    return ctx;
  }

  // A gain envelope: rise to `peak` by `attack`, hold until `release`, fade out by `end` (all seconds from t0).
  function envelope(ctx, t0, peak, attack, release, end) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + attack);
    g.gain.setValueAtTime(peak, t0 + release);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + end);
    return g;
  }

  function noiseSource(ctx, t0, duration) {
    const src = ctx.createBufferSource();
    src.buffer = noise;
    src.loop = true;
    src.start(t0);
    src.stop(t0 + duration);
    return src;
  }

  function tone(ctx, out, type, freq, t0, duration, peak) {
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    const env = envelope(ctx, t0, peak, 0.02, duration * 0.7, duration);
    osc.connect(env).connect(out);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
    return osc;
  }

  const SOUNDS = {
    // The goal song (the coach's pick): stadium organ "da-da-da-DAAA" with arena echo.
    goal(ctx, out, t0) {
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2600;
      lp.connect(out);
      if (echo) lp.connect(echo);
      const G4 = 392, C5 = 523.25, E5 = 659.25, G5 = 783.99;
      for (const [f, at, len] of [[G4, 0, 0.13], [C5, 0.14, 0.13], [E5, 0.28, 0.13], [G5, 0.42, 0.7]]) {
        tone(ctx, lp, 'square', f, t0 + at, len, 0.08);
        tone(ctx, lp, 'square', f / 2, t0 + at, len, 0.05);
      }
    },
    // Ref's pea whistle: two blasts with a fast trill.
    whistle(ctx, out, t0) {
      for (const [start, len] of [[0, 0.16], [0.24, 0.5]]) {
        const osc = ctx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = 2800;
        const vib = ctx.createOscillator();
        const vibDepth = ctx.createGain();
        vib.frequency.value = 25; vibDepth.gain.value = 140;
        vib.connect(vibDepth).connect(osc.frequency);
        const env = envelope(ctx, t0 + start, 0.22, 0.015, len - 0.04, len);
        osc.connect(env).connect(out);
        osc.start(t0 + start); osc.stop(t0 + start + len + 0.02);
        vib.start(t0 + start); vib.stop(t0 + start + len + 0.02);
      }
    },
    // Crowd roar: two bands of noise swelling up and fading.
    cheer(ctx, out, t0) {
      for (const [freq, q, peak] of [[900, 0.7, 0.28], [2400, 0.9, 0.16]]) {
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
        const env = envelope(ctx, t0, peak, 0.35, 0.9, 1.9);
        noiseSource(ctx, t0, 2).connect(bp).connect(env).connect(out);
      }
    },
    // Disappointed crowd: low, short "ooh".
    ooh(ctx, out, t0) {
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 520;
      noiseSource(ctx, t0, 1).connect(lp).connect(envelope(ctx, t0, 0.3, 0.12, 0.45, 0.95)).connect(out);
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(330, t0);
      osc.frequency.exponentialRampToValueAtTime(230, t0 + 0.9);
      osc.connect(envelope(ctx, t0, 0.08, 0.1, 0.5, 0.9)).connect(out);
      osc.start(t0); osc.stop(t0 + 1);
    },
    // Stadium organ "Charge!".
    organ(ctx, out, t0) {
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2600;
      lp.connect(out);
      const G4 = 392, C5 = 523.25, E5 = 659.25, G5 = 783.99;
      const notes = [[G4, 0, 0.13], [C5, 0.14, 0.13], [E5, 0.28, 0.13], [G5, 0.42, 0.3], [E5, 0.78, 0.12], [G5, 0.92, 0.65]];
      for (const [f, at, len] of notes) {
        tone(ctx, lp, 'square', f, t0 + at, len, 0.09);
        tone(ctx, lp, 'square', f / 2, t0 + at, len, 0.05);
      }
    },
    // Quick air sweep for banners flying in.
    swoosh(ctx, out, t0) {
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(400, t0);
      bp.frequency.exponentialRampToValueAtTime(3200, t0 + 0.3);
      noiseSource(ctx, t0, 0.35).connect(bp).connect(envelope(ctx, t0, 0.18, 0.08, 0.15, 0.32)).connect(out);
    }
  };

  audio.unlock = function () {
    if (audio.stale && audio.ctx) {
      // iPhone can leave a backgrounded sound engine stuck silent, so start a fresh one inside this tap.
      const old = audio.ctx;
      audio.ctx = null;
      echo = null;
      try { old.close().catch(() => {}); } catch (e) { /* already closed */ }
    }
    audio.stale = false;
    const ctx = ensureContext();
    if (!ctx) return Promise.resolve();
    audio.unlocked = true;
    // Newer iPhones: play game sounds even when the ringer switch is on silent.
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* older browsers */ }
    // iOS needs a sound started inside the tap itself.
    const blip = ctx.createBufferSource();
    blip.buffer = ctx.createBuffer(1, 1, 22050);
    blip.connect(ctx.destination);
    blip.start(0);
    return ctx.state === 'running' ? Promise.resolve() : ctx.resume().catch(() => {});
  };

  audio.setMuted = function (muted) {
    audio.muted = !!muted;
    if (audio.master) audio.master.gain.setTargetAtTime(audio.muted ? 0 : MASTER_GAIN, audio.ctx.currentTime, 0.02);
  };

  audio.play = function (name) {
    const ctx = audio.ctx;
    if (!ctx || !audio.unlocked || audio.muted || !SOUNDS[name]) return;
    const go = () => {
      try { SOUNDS[name](ctx, audio.master, ctx.currentTime + 0.01); } catch (e) { /* a missed sound never stops the game */ }
    };
    // The tap that unlocked audio may still be resuming the context (e.g. START → organ).
    if (ctx.state === 'running') go();
    else ctx.resume().then(go, () => {});
  };

  // Switching apps pauses the page; the next tap rebuilds the sound engine (see unlock).
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && audio.ctx) audio.stale = true;
  });

  HTG.audio = audio;
})();
</script>

  const TOKEN_UNIT = 10;      // tokens are drawn at radius 10 so their labels use real font sizes

  const sy = y => RINK.length - y;

  function svgEl(tag, attrs, parent) {
    const node = document.createElementNS(NS, tag);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }

  function htmlEl(tag, className, parent, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    if (parent) parent.appendChild(node);
    return node;
  }

  const SPEAKER_ON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const SPEAKER_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';

  // ---------- Shell ----------
  const root = document.getElementById('app');
  root.textContent = '';
  const board = htmlEl('header', 'board', root);
  const light = htmlEl('span', 'light', board);
  const whereEl = htmlEl('span', 'where', board);
  const scoreEl = htmlEl('span', 'score', board);
  const muteBtn = htmlEl('button', 'mute', board);
  muteBtn.type = 'button';
  const screenEl = htmlEl('main', null, root);
  screenEl.id = 'screen';

  function setMuteIcon(muted) {
    muteBtn.innerHTML = muted ? SPEAKER_OFF : SPEAKER_ON;
    muteBtn.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
  }
  setMuteIcon(false);

  // ---------- Rink ----------
  function drawRink(svg) {
    const { width, length, cornerRadius, goalLineY, blueLineY, redLineY, creaseRadius, circleRadius } = RINK;
    const defs = svgEl('defs', {}, svg);
    const clip = svgEl('clipPath', { id: 'rink-clip' }, defs);
    svgEl('rect', { x: 0, y: 0, width, height: length, rx: cornerRadius }, clip);
    svgEl('rect', { x: 0, y: 0, width, height: length, rx: cornerRadius, fill: 'var(--ice)' }, svg);
    const g = svgEl('g', { 'clip-path': 'url(#rink-clip)' }, svg);
    const red = 'var(--line-red)', blue = 'var(--line-blue)';
    if (LOGO) {
      const w = 26, h = w / LOGO_ASPECT;
      svgEl('image', { href: LOGO, x: width / 2 - w / 2, y: sy(redLineY) - h / 2, width: w, height: h, opacity: .55 }, g);
    }
    for (const y of goalLineY) svgEl('rect', { x: 0, y: sy(y) - .25, width, height: .5, fill: red }, g);
    for (const y of blueLineY) svgEl('rect', { x: 0, y: sy(y) - .8, width, height: 1.6, fill: blue }, g);
    svgEl('rect', { x: 0, y: sy(redLineY) - .7, width, height: 1.4, fill: red }, g);
    const cx = width / 2, half = 3;
    // Creases open toward the slot; nets sit just behind each goal line.
    svgEl('path', { d: `M${cx - creaseRadius},${sy(11)} A${creaseRadius},${creaseRadius} 0 0 1 ${cx + creaseRadius},${sy(11)} Z`, fill: 'var(--crease)', stroke: red, 'stroke-width': .3 }, g);
    svgEl('path', { d: `M${cx - creaseRadius},${sy(189)} A${creaseRadius},${creaseRadius} 0 0 0 ${cx + creaseRadius},${sy(189)} Z`, fill: 'var(--crease)', stroke: red, 'stroke-width': .3 }, g);
    svgEl('rect', { x: cx - half, y: sy(11), width: 2 * half, height: 3.5, rx: .6, fill: 'none', stroke: red, 'stroke-width': .5 }, g);
    svgEl('rect', { x: cx - half, y: sy(192.5), width: 2 * half, height: 3.5, rx: .6, fill: 'none', stroke: red, 'stroke-width': .5 }, g);
    for (const [x, y] of RINK.endDots) {
      svgEl('circle', { cx: x, cy: sy(y), r: circleRadius, fill: 'none', stroke: red, 'stroke-width': .4 }, g);
      svgEl('circle', { cx: x, cy: sy(y), r: 1, fill: red }, g);
      // Hash marks are on the sides of the circle facing the boards and the middle, where the wingers line up.
      const edge = Math.sqrt(circleRadius ** 2 - 2.9 ** 2);
      for (const side of [-1, 1]) {
        const hy = sy(y) + side * 2.9;
        svgEl('path', { d: `M${x - edge},${hy} h-2 M${x + edge},${hy} h2`, stroke: red, 'stroke-width': .35 }, g);
      }
    }
    for (const [x, y] of RINK.nzDots) svgEl('circle', { cx: x, cy: sy(y), r: 1, fill: red }, g);
    svgEl('circle', { cx: RINK.centerDot[0], cy: sy(RINK.centerDot[1]), r: circleRadius, fill: 'none', stroke: blue, 'stroke-width': .4 }, g);
    svgEl('circle', { cx: RINK.centerDot[0], cy: sy(RINK.centerDot[1]), r: .8, fill: blue }, g);
    svgEl('rect', { x: .4, y: .4, width: width - .8, height: length - .8, rx: cornerRadius - .4, fill: 'none', stroke: '#fff', 'stroke-width': 1.2 }, svg);
  }

  function teamLogo(parent, size = '') {
    if (!LOGO) return null;
    const img = htmlEl('img', size ? `team-logo ${size}` : 'team-logo', parent);
    img.src = LOGO;
    img.alt = 'Team logo';
    return img;
  }

  // Outer <g> is positioned and scaled; the inner .body can shake without fighting that.
  function makeToken(kind, label) {
    const g = svgEl('g', { class: `tok ${kind}` });
    const body = svgEl('g', { class: 'body' }, g);
    svgEl('circle', { class: 'halo', r: 1.5 * TOKEN_UNIT }, body);
    svgEl('circle', { r: TOKEN_UNIT }, body);
    svgEl('text', {}, body).textContent = label;
    return g;
  }

  // ---------- Play screen (built once, reused across plays) ----------
  const play = htmlEl('section', 'play');
  const stage = htmlEl('div', 'stage', play);
  const rink = svgEl('svg', { id: 'rink', preserveAspectRatio: 'xMidYMid meet', 'aria-label': 'Hockey rink' }, stage);
  const bannerLayer = htmlEl('div', 'banner-layer', stage);
  drawRink(rink);
  const targetLayer = svgEl('g', { class: 'targets' }, rink);
  const trailLayer = svgEl('g', { class: 'trails' }, rink);
  const arrow = svgEl('marker', { id: 'trail-head', viewBox: '0 0 10 10', refX: 6, refY: 5, markerWidth: 4, markerHeight: 4, orient: 'auto' },
    svgEl('defs', {}, rink));
  svgEl('path', { class: 'trail-head', d: 'M0 0L10 5L0 10z' }, arrow);
  const otherLayer = svgEl('g', { class: 'others' }, rink);
  const ourLayer = svgEl('g', { class: 'ours' }, rink);
  // One token per player in the current play (usually LD, RD, C, LW, RW; F1-F3 on the forecheck).
  const ourTokens = {};
  function buildOurTokens(names) {
    ourLayer.textContent = '';
    for (const k of Object.keys(ourTokens)) delete ourTokens[k];
    for (const pos of names) {
      ourTokens[pos] = makeToken('us', pos);
      ourTokens[pos].dataset.pos = pos;
      ourLayer.appendChild(ourTokens[pos]);
    }
  }
  buildOurTokens(OURS);

  const panel = htmlEl('aside', 'panel', play);
  const taskEl = htmlEl('div', 'task', panel);
  const taskLabel = htmlEl('small', null, taskEl);
  const taskText = htmlEl('span', null, taskEl);
  const benchEl = htmlEl('div', 'bench', panel);
  const coachEl = htmlEl('div', 'coach', panel);
  htmlEl('span', 'who', coachEl, 'COACH SAYS');
  const coachText = htmlEl('span', 'line', coachEl);
  const primaryBtn = htmlEl('button', 'primary', panel);
  primaryBtn.type = 'button';

  let mountedPlay = -1;
  let mountedView = VIEWS.dzone;
  let discFt = DISC_FT;

  // Size the SVG to exactly the play's window of rink, as big as the stage allows,
  // so nothing outside the window shows in letterbox space.
  function fitRink() {
    const aspect = RINK.width / (mountedView.yMax - mountedView.yMin);
    const portrait = window.matchMedia('(orientation: portrait)').matches;
    const availW = stage.clientWidth;
    const availH = portrait ? window.innerHeight * 0.62 : stage.clientHeight;
    let w = availW, h = availW / aspect;
    if (h > availH) { h = availH; w = availH * aspect; }
    rink.style.width = `${Math.floor(w)}px`;
    rink.style.height = `${Math.floor(h)}px`;
  }

  function pxPerFoot() {
    const m = rink.getScreenCTM();
    return m && m.a ? m.a : 8;
  }

  // The CSS transform (in SVG user units) lets the slide-to-target move animate; the
  // plain SVG attribute underneath positions the token even where that CSS is ignored.
  function placeToken(g, x, y, radius) {
    const s = radius / TOKEN_UNIT;
    g.setAttribute('transform', `translate(${x} ${sy(y)}) scale(${s})`);
    g.style.transform = `translate(${x}px, ${sy(y)}px) scale(${s})`;
  }

  function mountPlay(state) {
    const p = PLAYS[state.playIndex];
    const layout = LAYOUTS[p.layout];
    const view = VIEWS[layout.view];
    rink.setAttribute('viewBox', `0 ${sy(view.yMax)} ${RINK.width} ${view.yMax - view.yMin}`);
    mountedView = view;
    buildOurTokens(Object.keys(layout.ours));
    otherLayer.textContent = '';
    for (const o of layout.opponents) {
      const t = makeToken('them', 'X');
      t.dataset.id = o.id;
      t.dataset.x = o.x; t.dataset.y = o.y;
      otherLayer.appendChild(t);
    }
    if (layout.goalie) {
      const g = makeToken('goalie', 'G');
      g.dataset.x = layout.goalie.x; g.dataset.y = layout.goalie.y; g.dataset.scale = .85;
      otherLayer.appendChild(g);
    }
    const puck = svgEl('circle', { class: 'puck', r: TOKEN_UNIT }, otherLayer);
    puck.dataset.x = layout.puck.x; puck.dataset.y = layout.puck.y; puck.dataset.scale = .42;
    targetLayer.textContent = '';
    mountedPlay = state.playIndex;
  }

  // Where each of our players is drawn right now (null = not on the ice).
  function drawnSpot(state, pos) {
    const p = state.positions[pos];
    if (!p) return null;
    if (p.status === 'active') return state.pending || (p.x === null ? null : { x: p.x, y: p.y });
    if (p.status === 'bench') return null;
    return { x: p.x, y: p.y };
  }

  function layoutTokens(state) {
    fitRink();
    const scale = pxPerFoot();
    discFt = Math.max(DISC_FT, (scale < PHONE_PX_PER_FT ? PHONE_MIN_DISC_PX : MIN_DISC_PX) / scale);
    for (const node of otherLayer.children) {
      placeToken(node, +node.dataset.x, +node.dataset.y, discFt * (+node.dataset.scale || 1));
    }
    for (const pos of Object.keys(ourTokens)) {
      const g = ourTokens[pos];
      const st = state.positions[pos];
      const spot = drawnSpot(state, pos);
      g.style.display = spot ? '' : 'none';
      g.classList.toggle('active', !!st && st.status === 'active');
      g.classList.toggle('old', !!st && st.status === 'old');
      g.querySelector('text').textContent = (st && st.label) || pos;
      if (spot) placeToken(g, spot.x, spot.y, discFt);
    }
    drawTrails(state);
  }

  // A rotating forward leaves a ghost on their old spot and a dashed arrow to where they're going.
  function drawTrails(state) {
    trailLayer.textContent = '';
    for (const pos of Object.keys(ourTokens)) {
      const st = state.positions[pos];
      const to = st && st.from && drawnSpot(state, pos);
      if (!to) continue;
      svgEl('circle', { class: 'ghost', cx: st.from.x, cy: sy(st.from.y), r: discFt }, trailLayer);
      const dx = to.x - st.from.x, dy = to.y - st.from.y, len = Math.hypot(dx, dy);
      if (len < discFt * 3) continue;
      // Stop the arrow at the edge of the player so its head shows.
      const k = (len - discFt * 1.25) / len;
      svgEl('line', {
        class: 'trail', 'marker-end': 'url(#trail-head)',
        x1: st.from.x, y1: sy(st.from.y), x2: st.from.x + dx * k, y2: sy(st.from.y + dy * k)
      }, trailLayer);
    }
  }

  const stillOnWrongSpot = (state, p) =>
    p.type === 'spot' && state.pending && state.pending.x === p.wrong.x && state.pending.y === p.wrong.y;

  function taskFor(state, p) {
    if (p.type === 'rotate') {
      const job = p.order[state.step];
      const picking = state.phase === 'pick' || (state.phase === 'feedback' && state.last.kind === 'pick');
      return picking ? `Who's your new ${job}? Tap them.` : `Place your new ${job}.`;
    }
    if (p.type === 'spot') {
      const picking = state.phase === 'pick' || (state.phase === 'feedback' && state.last.kind === 'pick');
      return picking ? p.task : 'Now click where they should be.';
    }
    if (p.type === 'placeAll') return `Place your ${NAMES[p.order[state.step]]}.`;
    return p.task;
  }

  function hintFor(state, p) {
    if (state.phase === 'feedback') return state.last.line;
    if (state.phase === 'pick' && p.type === 'rotate') {
      return `Your forwards are still on their old spots (dashed). Who should be the new ${p.order[state.step]}?`;
    }
    if (state.phase === 'pick') return p.situation + ' Look carefully at your blue players.';
    if (stillOnWrongSpot(state, p)) return 'Click the ice where the glowing player should be, then hit LOCK IT IN.';
    if (state.pending) return 'Happy with that spot? Hit LOCK IT IN. (Or click somewhere else to move them.)';
    if (p.type === 'rotate') {
      const job = p.order[state.step];
      return `Your old ${p.was[job]} is the new ${job}. Click the ice where they should go.`;
    }
    if (p.type === 'placeAll' && state.step === 0) return p.task + ' Click the ice where each player should go.';
    return 'Click the ice where your player should go.';
  }

  function renderBench(state, p) {
    benchEl.textContent = '';
    if (p.type === 'spot' || p.type === 'rotate') return;
    for (const pos of p.order) {
      const st = state.positions[pos];
      if (!st || st.status === 'ice') continue;
      if (st.status === 'active' && state.pending) continue;
      const b = htmlEl('span', 'bench-tok ' + (st.status === 'active' ? 'active' : 'waiting'), benchEl, pos);
      b.title = NAMES[pos];
    }
  }

  function renderPlay(state) {
    if (play.parentNode !== screenEl) { screenEl.textContent = ''; screenEl.appendChild(play); }
    if (mountedPlay !== state.playIndex) mountPlay(state);
    const p = PLAYS[state.playIndex];
    layoutTokens(state);
    taskLabel.textContent = (p.double ? '★ DOUBLE POINTS  ·  ' : '')
      + (p.type === 'placeAll' || p.type === 'rotate' ? `${p.situation}  ·  PLAYER ${state.step + 1} OF ${p.order.length}` : p.situation);
    taskText.textContent = taskFor(state, p);
    renderBench(state, p);
    coachText.textContent = hintFor(state, p);
    coachEl.classList.toggle('result', state.phase === 'feedback');
    play.classList.toggle('pick-phase', state.phase === 'pick');
    play.classList.toggle('placing', state.phase === 'place');
    if (state.phase !== 'feedback') clearFeedback();
    if (state.phase === 'pick') {
      primaryBtn.hidden = true;
    } else {
      primaryBtn.hidden = false;
      primaryBtn.textContent = state.phase === 'feedback' ? 'NEXT' : 'LOCK IT IN';
      primaryBtn.disabled = state.phase === 'feedback' ? Date.now() < nextReadyAt : !state.pending || stillOnWrongSpot(state, p);
    }
  }

  // ---------- Feedback moment: banner, sound, goal light, slide to the right spot ----------
  const sfx = name => { if (HTG.audio) HTG.audio.play(name); };
  const BANNERS = {
    perfect: r => [`PERFECT SPOT! +${r.points}`, 'perfect'],
    nice: r => [`NICE! +${r.points}`, 'nice'],
    close: r => [`CLOSE! +${r.points}`, 'close'],
    miss: () => ['WHISTLE!', 'miss']
  };
  const SOUNDS = { perfect: ['goal', 'cheer'], nice: ['cheer'], close: ['ooh'], miss: ['whistle'] };
  const NEXT_DELAY_MS = 1200;
  let nextReadyAt = 0;
  let feedbackSeq = 0;
  const timers = [];

  function later(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function showBanner(text, kind) {
    bannerLayer.textContent = '';
    htmlEl('div', `banner ${kind}`, bannerLayer, text);
    sfx('swoosh');
  }

  function flashGoalLight() {
    // 3 flashes at 2.5 per second: well under the 3-per-second photosensitivity limit.
    for (let i = 0; i < 6; i++) later(i * 200, () => light.classList.toggle('on', i % 2 === 0));
    later(1200, () => light.classList.remove('on'));
  }

  function slideToken(pos, from, to) {
    const g = ourTokens[pos];
    g.classList.remove('slide');
    placeToken(g, from.x, from.y, discFt);
    g.getBoundingClientRect();
    g.classList.add('slide');
    placeToken(g, to.x, to.y, discFt);
    later(700, () => g.classList.remove('slide'));
  }

  function clearFeedback() {
    while (timers.length) clearTimeout(timers.pop());
    bannerLayer.textContent = '';
    targetLayer.textContent = '';
    light.classList.remove('on');
    for (const pos of Object.keys(ourTokens)) {
      ourTokens[pos].classList.remove('lit', 'slide');
      ourTokens[pos].firstChild.classList.remove('shake');
    }
  }

  function runFeedback(state) {
    clearFeedback();
    const seq = ++feedbackSeq;
    nextReadyAt = Date.now() + NEXT_DELAY_MS;
    primaryBtn.disabled = true;
    setTimeout(() => {
      if (seq === feedbackSeq && HTG.app.state.phase === 'feedback') primaryBtn.disabled = false;
    }, NEXT_DELAY_MS);

    const last = state.last;
    const p = PLAYS[state.playIndex];
    if (last.kind === 'pick') {
      const culprit = ourTokens[last.right];
      culprit.classList.add('lit');
      if (last.correct) {
        showBanner(`${p.type === 'rotate' ? 'RIGHT CALL!' : 'GOOD EYE!'} +${last.points}`, 'pick');
        sfx('cheer');
      } else {
        showBanner('WHISTLE!', 'miss');
        sfx('whistle');
        culprit.firstChild.classList.add('shake');
      }
      return;
    }

    const [text, kind] = BANNERS[last.tier](last);
    showBanner(text, kind);
    for (const s of SOUNDS[last.tier]) sfx(s);
    if (last.tier === 'perfect') flashGoalLight();
    const target = state.positions[last.pos];
    if (last.tier !== 'perfect') {
      svgEl('circle', { class: 'target-ring', cx: target.x, cy: sy(target.y), r: discFt * 1.7 }, targetLayer);
      slideToken(last.pos, last.from, target);
    }
    if (last.hatTrick) {
      later(1900, () => { showBanner('HAT TRICK!', 'hattrick'); sfx('goal'); flashGoalLight(); });
    }
  }

  // ---------- Input: click (or tap) the ice to place, or tap a player to pick ----------
  // A click near the boards still lands the whole disc on the ice (the reducer's own clamp is the safety net).
  function clickSpot(cx, cy) {
    return HTG.logic.clampToRink(clientToRink(cx, cy), Math.max(2.5, discFt));
  }

  // "Spot it" taps pick the closest of our players, so a near-miss on a small phone disc still counts.
  const PICK_SLOP_PX = 16;
  function nearestOurPlayer(cx, cy) {
    const p = clientToRink(cx, cy);
    const reach = discFt + PICK_SLOP_PX / pxPerFoot();
    let best = null, bestDist = Infinity;
    const rotating = PLAYS[state.playIndex].type === 'rotate';
    for (const pos of Object.keys(ourTokens)) {
      const spot = drawnSpot(state, pos);
      // In a rotation only forwards still on their old spots are a choice.
      if (!spot || (rotating && state.positions[pos].status !== 'old')) continue;
      const d = Math.hypot(spot.x - p.x, spot.y - p.y);
      if (d < bestDist) { best = pos; bestDist = d; }
    }
    return bestDist <= reach ? best : null;
  }

  rink.addEventListener('click', e => {
    if (state.screen !== 'play') return;
    if (state.phase === 'pick') {
      const pos = nearestOurPlayer(e.clientX, e.clientY);
      if (pos) dispatch({ type: 'PICK', pos });
      return;
    }
    if (state.phase !== 'place') return;
    const p = clickSpot(e.clientX, e.clientY);
    dispatch({ type: 'MOVE', x: p.x, y: p.y });
  });

  // ---------- Title, how-to, period intro, intermission, final ----------
  const MAX_SCORE = HTG.logic.maxScore(PLAYS);
  const fmt = n => n.toLocaleString('en-US');
  const ZAMBONI = '<svg viewBox="0 0 100 54" aria-hidden="true"><rect x="6" y="14" width="70" height="30" rx="6" fill="#1e6bff" stroke="#fff" stroke-width="3"/>'
    + '<rect x="58" y="4" width="24" height="18" rx="4" fill="#0a1226" stroke="#fff" stroke-width="3"/><rect x="76" y="26" width="18" height="18" rx="3" fill="#ffb627"/>'
    + '<circle cx="24" cy="46" r="7" fill="#111" stroke="#fff" stroke-width="2"/><circle cx="62" cy="46" r="7" fill="#111" stroke="#fff" stroke-width="2"/>'
    + '<text x="30" y="35" font-family="Bebas Neue, Impact, sans-serif" font-size="14" fill="#fff">ICE</text></svg>';

  function cta(parent, label, action) {
    const b = htmlEl('button', 'cta', parent, label);
    b.type = 'button';
    b.addEventListener('click', () => {
      if (HTG.audio) HTG.audio.unlock();
      dispatch({ type: action });
    });
    return b;
  }

  const SCREENS = {
    title(state, wrap) {
      teamLogo(wrap);
      htmlEl('div', 'kicker', wrap, 'DEFENSE POSITIONING CHALLENGE');
      const h = htmlEl('h1', null, wrap);
      h.append('PROTECT THE ');
      htmlEl('em', null, h, 'HOUSE');
      htmlEl('p', 'sub', wrap, 'Fourteen plays. Three periods. Put your players in the right spot and guard the front of your net!');
      htmlEl('div', 'player-tag', wrap, `PLAYING AS ${HTG.logic.boardLabel(me()).toUpperCase()}`);
      if (state.best > 0) htmlEl('div', 'best', wrap, `YOUR BEST: ${fmt(state.best)}`);
      cta(wrap, 'START', 'START');
      const links = htmlEl('div', 'title-links', wrap);
      link(links, 'Team leaderboard', openBoardOverlay);
      link(links, 'How to play', () => dispatch({ type: 'HOWTO' }));
      link(links, 'Not you?', forgetPlayer);
    },
    howto(state, wrap) {
      htmlEl('h2', null, wrap, 'HOW TO PLAY');
      const steps = htmlEl('div', 'steps', wrap);
      const lines = ['Click (or tap) the ice where your player should go.', 'Press LOCK IT IN.', 'Read what Coach says. Then hit NEXT.'];
      lines.forEach((line, i) => {
        const s = htmlEl('div', 'step', steps);
        htmlEl('b', null, s, String(i + 1));
        s.append(line);
      });
      htmlEl('p', 'sub', wrap, "Some plays ask you to find the player who's out of position. Tap them, then click where they should be!");
      cta(wrap, "LET'S GO", 'LETS_GO');
    },
    periodIntro(state, wrap) {
      const period = PLAYS[state.playIndex].period;
      htmlEl('div', 'kicker', wrap, 'GET READY');
      htmlEl('h1', null, wrap, `${ORDINAL[period - 1]} PERIOD`);
      htmlEl('h2', null, wrap, PERIODS[period - 1].name.toUpperCase());
      htmlEl('p', 'sub', wrap, `${PLAYS.filter(p => p.period === period).length} plays. Score: ${fmt(state.score)}.`);
      cta(wrap, 'BEGIN', 'BEGIN_PERIOD');
    },
    intermission(state, wrap) {
      const ended = PLAYS[state.playIndex - 1].period;
      const lane = htmlEl('div', 'zlane', wrap);
      htmlEl('div', 'zamboni', lane).innerHTML = ZAMBONI;
      htmlEl('div', 'kicker', wrap, 'INTERMISSION');
      htmlEl('h1', null, wrap, `END OF THE ${ORDINAL[ended - 1]}`);
      const tally = htmlEl('div', 'tally', wrap);
      htmlEl('b', null, htmlEl('div', null, tally, 'THIS PERIOD'), `+${fmt(state.periodScores[ended - 1])}`);
      htmlEl('b', null, htmlEl('div', null, tally, 'TOTAL'), fmt(state.score));
      cta(wrap, `START ${ORDINAL[ended]} PERIOD`, 'NEXT');
    },
    final(state, wrap) {
      teamLogo(wrap, 'small');
      htmlEl('div', 'kicker', wrap, 'FINAL SCORE');
      const big = htmlEl('div', 'bigscore', wrap, fmt(state.score));
      htmlEl('small', null, big, ` / ${fmt(MAX_SCORE)}`);
      htmlEl('div', 'award', wrap, HTG.logic.titleFor(state.score, MAX_SCORE).toUpperCase());
      if (state.newBest) htmlEl('div', 'newbest', wrap, 'NEW PERSONAL BEST!');
      else if (state.best > 0) htmlEl('div', 'best', wrap, `YOUR BEST: ${fmt(state.best)}`);
      const box = htmlEl('div', 'lb', wrap);
      loadBoard(box, scoreToPost);
      scoreToPost = null;
      cta(wrap, 'PLAY AGAIN', 'PLAY_AGAIN');
    }
  };

  function link(parent, label, onClick) {
    const b = htmlEl('button', 'linkish', parent, label);
    b.type = 'button';
    b.addEventListener('click', onClick);
    return b;
  }

  // ---------- Team leaderboard (stored in a Google Sheet, shown here) ----------
  const me = () => ({ ...player, who });
  let scoreToPost = null;
  // Players and parents each have a board, plus one with everyone. Each board opens on your own group's tab.
  const BOARD_TABS = [['players', 'PLAYERS'], ['parents', 'PARENTS'], ['board', 'EVERYONE']];

  // Posts this game's score (when given) and shows the board. Any failure just shows a short note.
  async function loadBoard(box, score) {
    box.textContent = '';
    htmlEl('h3', null, box, 'TEAM LEADERBOARD');
    const status = htmlEl('p', 'lb-status', box);
    const url = HTG.data.LEADERBOARD_URL;
    if (!url) {
      status.textContent = "The team leaderboard isn't connected yet.";
      return;
    }
    status.textContent = score != null ? 'Posting your score to the team board…' : 'Loading the team board…';
    try {
      const res = await fetch(url, score != null
        ? { method: 'POST', body: JSON.stringify({ name: player.name, number: player.number, who, score }) }
        : {});
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'refused');
      drawBoard(box, status, data);
    } catch (e) {
      status.textContent = "Couldn't reach the team leaderboard right now. Try again later.";
    }
  }

  function drawBoard(box, status, data) {
    status.remove();
    // A leaderboard script from before parents could play only sends `board`, and everyone on it is a player.
    const lists = { board: data.board, players: data.players || data.board, parents: data.parents || [] };
    const tabs = htmlEl('div', 'lb-tabs', box);
    const body = htmlEl('div', 'lb-body', box);
    const show = key => {
      for (const b of tabs.children) b.classList.toggle('on', b.dataset.key === key);
      fillBoard(body, lists[key], key);
    };
    for (const [key, label] of BOARD_TABS) {
      const b = htmlEl('button', 'lb-tab', tabs, label);
      b.type = 'button';
      b.dataset.key = key;
      b.addEventListener('click', () => show(key));
    }
    show(who === 'parent' ? 'parents' : 'players');
  }

  function fillBoard(body, board, key) {
    body.textContent = '';
    const rank = HTG.logic.findRank(board, me());
    const mine = key === 'board' || key === (who === 'parent' ? 'parents' : 'players');
    const where = key === 'board' ? 'overall' : key === 'parents' ? 'of the parents' : 'on the team';
    const note = rank ? `You're #${rank} ${where}!`
      : mine ? (board.length ? 'Play a game to get on the board!' : 'Be the first on the board!')
      : (board.length ? '' : 'No scores here yet.');
    if (note) htmlEl('p', 'lb-rank', body, note);
    const list = htmlEl('ol', null, body);
    const row = (r, i) => {
      const li = htmlEl('li', HTG.logic.findRank([r], me()) ? 'me' : '', list);
      htmlEl('span', 'r', li, String(i + 1));
      htmlEl('span', 'n', li, HTG.logic.boardLabel(r));
      htmlEl('span', 's', li, fmt(r.score));
    };
    board.slice(0, 10).forEach(row);
    if (rank && rank > 10) {
      htmlEl('li', 'gap', list, '…');
      row(board[rank - 1], rank - 1);
    }
  }

  function openBoardOverlay() {
    const overlay = htmlEl('div', 'lb-overlay', document.body);
    const box = htmlEl('div', 'lb', overlay);
    const back = htmlEl('button', 'cta', overlay, 'BACK');
    back.type = 'button';
    back.addEventListener('click', () => overlay.remove());
    loadBoard(box, null);
  }

  function renderScreen(state, prev) {
    mountedPlay = -1;
    screenEl.textContent = '';
    SCREENS[state.screen](state, htmlEl('section', 'scr', screenEl));
    if (prev && prev.screen === state.screen) return;
    if (state.screen === 'periodIntro') sfx('organ');
    if (state.screen === 'final') {
      sfx(state.newBest ? 'goal' : 'cheer');
      if (state.newBest) flashGoalLight();
    }
  }

  function renderBoard(state) {
    const p = PLAYS[Math.min(state.playIndex, PLAYS.length - 1)];
    const inGame = !['title', 'howto'].includes(state.screen);
    const label = !inGame ? 'PROTECT THE HOUSE'
      : state.screen === 'final' ? 'FINAL'
      : state.screen === 'intermission' ? 'INTERMISSION'
      : null;
    whereEl.textContent = '';
    if (label) {
      whereEl.textContent = label;
    } else {
      // Phones get the short form so the score never gets pushed off.
      htmlEl('span', 'long', whereEl, `${ORDINAL[p.period - 1]} PERIOD  ·  PLAY ${p.n} / ${PLAYS.length}`);
      htmlEl('span', 'short', whereEl, `${ORDINAL[p.period - 1]}  ·  ${p.n}/${PLAYS.length}`);
    }
    scoreEl.textContent = inGame ? `SCORE ${fmt(state.score)}` : '';
  }

  // Team password screen, shown until this device has entered the password once.
  function renderGate() {
    mountedPlay = -1;
    screenEl.textContent = '';
    const wrap = htmlEl('section', 'scr', screenEl);
    teamLogo(wrap);
    htmlEl('div', 'kicker', wrap, 'TEAM ONLY');
    const h = htmlEl('h1', null, wrap);
    h.append('PROTECT THE ');
    htmlEl('em', null, h, 'HOUSE');
    const form = htmlEl('form', 'gate-form', wrap);
    const label = htmlEl('label', null, form, 'Team password');
    label.htmlFor = 'team-password';
    const input = htmlEl('input', null, form);
    input.id = 'team-password';
    input.type = 'text';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.setAttribute('autocapitalize', 'none');
    input.setAttribute('autocorrect', 'off');
    input.setAttribute('enterkeyhint', 'go');
    const msg = htmlEl('p', 'gate-msg', form);
    const go = htmlEl('button', 'cta', form, "LET'S PLAY");
    go.type = 'submit';
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (HTG.logic.checkPassword(input.value)) {
        store.set('teamKey', HTG.logic.TEAM_PASSWORD_HASH);
        unlocked = true;
        render(state, null);
        return;
      }
      msg.textContent = "That's not it. Ask your coach for the team password.";
      form.classList.remove('nope');
      void form.offsetWidth;
      form.classList.add('nope');
      input.select();
    });
  }

  // Someone has said who they are: start a fresh game showing their own best score.
  function startAs() {
    confirmed = true;
    state = createGame({ seenHowTo: state.seenHowTo, best: store.get(HTG.logic.bestKey(me()), 0) });
    render(state, null);
  }

  // Someone else is playing: ask player or parent, then their name, again.
  function forgetPlayer() {
    player = null;
    who = null;
    store.set('player', null);
    store.set('who', null);
    render(state, null);
  }

  // "Who's playing?" check, every time the game opens and after PLAY AGAIN, so nobody plays on
  // someone else's name just because it was already there (coach).
  function renderConfirmScreen() {
    mountedPlay = -1;
    screenEl.textContent = '';
    const wrap = htmlEl('section', 'scr', screenEl);
    teamLogo(wrap, 'small');
    htmlEl('div', 'kicker', wrap, 'BEFORE YOU PLAY');
    htmlEl('h2', null, wrap, "WHO'S PLAYING?");
    const row = htmlEl('div', 'confirm-choice', wrap);
    const mine = htmlEl('button', 'cta', row, `I'M ${HTG.logic.boardLabel(me()).toUpperCase()}`);
    mine.type = 'button';
    mine.addEventListener('click', startAs);
    const other = htmlEl('button', 'cta alt', row, "I'M SOMEONE ELSE");
    other.type = 'button';
    other.addEventListener('click', forgetPlayer);
  }

  // "Player or parent?" screen, shown once the password is in, until this device has picked one.
  function renderWhoScreen() {
    mountedPlay = -1;
    screenEl.textContent = '';
    const wrap = htmlEl('section', 'scr', screenEl);
    htmlEl('div', 'kicker', wrap, 'WELCOME TO THE TEAM');
    htmlEl('h2', null, wrap, 'ARE YOU A…');
    const row = htmlEl('div', 'who-choice', wrap);
    for (const [value, label] of [['player', 'PLAYER'], ['parent', 'PARENT']]) {
      const b = htmlEl('button', 'cta', row, label);
      b.type = 'button';
      b.addEventListener('click', () => {
        who = value;
        store.set('who', who);
        render(state, null);
      });
    }
  }

  // "Who's playing?" screen, shown until this device has a player name.
  function renderNameScreen() {
    mountedPlay = -1;
    screenEl.textContent = '';
    const wrap = htmlEl('section', 'scr', screenEl);
    htmlEl('div', 'kicker', wrap, 'FOR THE TEAM LEADERBOARD');
    htmlEl('h2', null, wrap, "WHO'S PLAYING?");
    const form = htmlEl('form', 'gate-form', wrap);
    const field = (id, label, attrs) => {
      htmlEl('label', null, form, label).htmlFor = id;
      const input = htmlEl('input', null, form);
      input.id = id;
      input.autocomplete = 'off';
      input.spellcheck = false;
      for (const k in attrs) input.setAttribute(k, attrs[k]);
      return input;
    };
    const parent = who === 'parent';
    const nameIn = field('player-name', parent ? 'Your first name' : 'First name',
      { type: 'text', maxlength: '16', autocapitalize: 'words', autocorrect: 'off' });
    const numIn = field('player-number', parent ? "Your player's jersey number" : 'Jersey number',
      { type: 'text', inputmode: 'numeric', maxlength: '3', enterkeyhint: 'go' });
    const msg = htmlEl('p', 'gate-msg', form);
    const go = htmlEl('button', 'cta', form, "THAT'S ME");
    go.type = 'submit';
    form.addEventListener('submit', e => {
      e.preventDefault();
      const name = HTG.logic.cleanName(nameIn.value);
      if (!name) {
        msg.textContent = 'Type your first name.';
        nameIn.focus();
        return;
      }
      player = { name, number: HTG.logic.cleanNumber(numIn.value) };
      store.set('player', player);
      startAs();
    });
  }

  function render(state, prev) {
    renderBoard(state);
    if (!unlocked) {
      renderGate();
      return;
    }
    if (!who) {
      renderWhoScreen();
      return;
    }
    if (!player) {
      renderNameScreen();
      return;
    }
    if (!confirmed) {
      renderConfirmScreen();
      return;
    }
    if (state.screen === 'play') {
      renderPlay(state, prev);
      if (state.last && state.phase === 'feedback' && (!prev || prev.last !== state.last)) runFeedback(state);
    } else {
      clearFeedback();
      renderScreen(state, prev);
    }
  }

  // ---------- Coordinates ----------
  function rinkToClient(x, y) {
    const pt = rink.createSVGPoint();
    pt.x = x; pt.y = sy(y);
    const p = pt.matrixTransform(rink.getScreenCTM());
    return { cx: p.x, cy: p.y };
  }

  function clientToRink(cx, cy) {
    const pt = rink.createSVGPoint();
    pt.x = cx; pt.y = cy;
    const p = pt.matrixTransform(rink.getScreenCTM().inverse());
    return { x: p.x, y: sy(p.y) };
  }

  // ---------- App ----------
  function browserStorage() {
    try { return window.localStorage; } catch (e) { return null; }
  }
  const store = HTG.logic.makeStore(browserStorage());
  // "Your best" is per person (see startAs), so it starts empty until someone says who they are.
  let state = createGame({ seenHowTo: store.get('seenHowTo', false), best: 0 });
  let unlocked = store.get('teamKey', null) === HTG.logic.TEAM_PASSWORD_HASH;
  const saved = store.get('player', null);
  let player = saved && HTG.logic.cleanName(saved.name)
    ? { name: HTG.logic.cleanName(saved.name), number: HTG.logic.cleanNumber(saved.number) } : null;
  // Devices set up before parents could play have a name but no "who", so they get asked once.
  let who = ['player', 'parent'].includes(store.get('who', null)) ? store.get('who', null) : null;
  // Whether whoever is holding the device has said who they are since the game opened (or since PLAY AGAIN).
  let confirmed = false;

  function dispatch(action) {
    if (!unlocked || !who || !player || !confirmed) return state;
    const prev = state;
    state = reduce(state, action);
    if (state === prev) return state;
    if (action.type === 'PLAY_AGAIN') confirmed = false;
    if (state.seenHowTo && !prev.seenHowTo) store.set('seenHowTo', true);
    if (state.screen === 'final' && prev.screen !== 'final') {
      store.set(HTG.logic.bestKey(me()), state.best);
      scoreToPost = state.score;
    }
    render(state, prev);
    return state;
  }

  primaryBtn.addEventListener('click', () => dispatch({ type: state.phase === 'feedback' ? 'NEXT' : 'LOCK' }));

  // Sound: unlocked by the first tap anywhere (START is the usual one), mute remembered.
  const audio = HTG.audio;
  audio.setMuted(store.get('muted', false));
  setMuteIcon(audio.muted);
  muteBtn.addEventListener('click', () => {
    audio.unlock();
    audio.setMuted(!audio.muted);
    setMuteIcon(audio.muted);
    store.set('muted', audio.muted);
  });
  // iPhone and iPad pause sound when the kid switches apps; any tap brings it back. iPhone only
  // lets a touchend or click (not a pointerdown) start sound, so listen for all three.
  const wakeAudio = () => {
    if (audio.stale || !audio.ctx || audio.ctx.state !== 'running') audio.unlock();
  };
  for (const type of ['pointerdown', 'touchend', 'click']) {
    document.addEventListener(type, wakeAudio, { capture: true, passive: true });
  }

  // Rotating an iPad or resizing the window rescales the discs; spots stay in rink feet.
  const relayout = () => { if (state.screen === 'play') layoutTokens(state); };
  window.addEventListener('resize', relayout);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(stage);

  HTG.ui = { render, rinkToClient, clientToRink, setMuteIcon, store, elements: { rink, stage, panel, benchEl, primaryBtn, ourTokens, otherLayer, targetLayer, coachText, light, muteBtn, screenEl } };
  HTG.app = { get state() { return state; }, dispatch };
  render(state, null);
})();
</script>
</body>
</html>
